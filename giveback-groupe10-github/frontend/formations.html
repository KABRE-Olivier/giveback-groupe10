<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveback Groupe 10 — Mini-formations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .video-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .video-frame{ position:relative; width:100%; padding-top:56.25%; background:#000; }
  .video-frame iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
  .video-body{ padding:16px 18px; }
  .video-body h3{ font-size:15px; margin:0 0 6px; font-weight:500; }
  .video-body p{ font-family:Inter,sans-serif; font-size:12.5px; color:var(--ink-soft); margin:0; }
  .cat-heading{ font-family:Inter,sans-serif; font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.05em; text-transform:uppercase; margin:32px 0 14px; }
  .cat-heading:first-of-type{ margin-top:0; }
</style>
</head>
<body>

<div class="ambient-layer" style="display:none"><div class="wash"></div><div id="ambientParticles"></div></div>
<header class="topbar">
  <a class="brand" href="index.html">
    <img src="https://i.postimg.cc/k5xbX766/telechargement.jpg" alt="Giveback Groupe 10" class="brand-mark">
    <div class="brand-text">
      <div class="brand-word">Giveback Groupe 10</div>
      <div class="brand-tagline">Éducation, accès aux opportunités</div>
    </div>
  </a>
  <nav class="sans">
    <a href="index.html">Opportunités</a>
    <a href="formations.html">Mini-formations</a>
    <a href="mentors.html">Mentors</a>
    <a href="communaute.html">Communauté</a>
    <a href="espace.html">Mon espace</a>
  </nav>
</header>

<section class="page-shell">
  <div class="shell-bg"></div>
  <div class="shell-particles" id="heroParticles"></div>

  <div class="hero-content" style="padding-top:56px; padding-bottom:8px;">
    <h1>Mini-formations</h1>
    <p class="lead">De courtes vidéos pour préparer vos candidatures : CV, lettre de motivation, et plus à venir.</p>
  </div>

  <div class="wrap shell-inner">
  <div id="content">
    <p class="sans" style="color:#D9E2DD">Chargement…</p>
  </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
async function init() {
  const { data, error } = await db
    .from("formations")
    .select("*")
    .order("categorie", { ascending: true });

  const content = document.getElementById("content");
  content.innerHTML = "";

  if (error) {
    content.innerHTML = `<p class="sans" style="color:var(--danger)">Erreur : ${error.message}</p>`;
    return;
  }
  if (!data || data.length === 0) {
    content.innerHTML = `<div class="empty">Aucune mini-formation pour le moment. Ajoutes-en depuis Supabase (table "formations").</div>`;
    return;
  }

  const byCategory = {};
  data.forEach(f => {
    if (!byCategory[f.categorie]) byCategory[f.categorie] = [];
    byCategory[f.categorie].push(f);
  });

  Object.keys(byCategory).forEach(cat => {
    const heading = document.createElement("div");
    heading.className = "cat-heading";
    heading.textContent = cat;
    content.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "grid";
    byCategory[cat].forEach(f => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <div class="video-frame">
          <iframe src="https://www.youtube.com/embed/${f.video_id}" title="${f.titre}" allowfullscreen></iframe>
        </div>
        <div class="video-body">
          <h3>${f.titre}</h3>
          <p>${f.description || ""}</p>
        </div>
      `;
      grid.appendChild(card);
    });
    content.appendChild(grid);
  });
}
init();
</script>
<script>
(function () {
  const zone = document.getElementById("heroParticles");
  if (!zone) return;
  const n = 26;
  for (let i = 0; i < n; i++) {
    const dot = document.createElement("span");
    const size = 3 + Math.random() * 5;
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.left = Math.random() * 100 + "%";
    dot.style.top = Math.random() * 100 + "%";
    dot.style.animationDuration = (5 + Math.random() * 6) + "s";
    dot.style.animationDelay = (Math.random() * 6) + "s";
    zone.appendChild(dot);
  }
})();
</script>
</body>
</html>
