<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveback Groupe 10 — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{ max-width:1100px; margin:0 auto; padding:40px 24px 100px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin:24px 0 40px; }
  .stat-card{ background:var(--forest); color:var(--paper); border-radius:12px; padding:20px; }
  .stat-num{ font-size:32px; font-weight:700; font-family:Inter,sans-serif; line-height:1; margin-bottom:6px; }
  .stat-label{ font-family:Inter,sans-serif; font-size:12px; color:#C7D3CE; }
  .section-title{ font-size:19px; font-weight:500; margin:36px 0 14px; }
  table{ width:100%; border-collapse:collapse; background:var(--paper-raised); border-radius:10px; overflow:hidden; }
  th{ background:var(--forest-deep); color:var(--paper); font-family:Inter,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.04em; text-align:left; padding:10px 14px; }
  td{ padding:10px 14px; border-top:1px solid var(--line); font-family:Inter,sans-serif; font-size:13px; }
  tr:hover td{ background:var(--paper); }
  .status-pill{ font-family:Inter,sans-serif; font-size:10.5px; padding:3px 9px; border-radius:999px; background:var(--gold-soft); color:var(--forest-deep); font-weight:600; }
  .locked{ max-width:480px; margin:80px auto; text-align:center; }
  .locked h1{ font-size:22px; }
  .locked p{ font-family:Inter,sans-serif; color:var(--ink-soft); font-size:14px; }
  .empty-row td{ text-align:center; color:var(--ink-soft); font-style:italic; }
  .mentor-photos-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:16px; margin-bottom:40px; }
  .mentor-photo-card{ background:var(--paper-raised); border-radius:12px; padding:16px; text-align:center; }
  .mentor-photo-card img, .mentor-photo-card .avatar-placeholder{
    width:72px; height:72px; border-radius:50%; object-fit:cover; margin:0 auto 10px; display:block;
    background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center; font-family:Inter,sans-serif; font-weight:700;
  }
  .mentor-photo-card img{ display:block; }
  .mentor-photo-card h4{ font-size:13px; margin:0 0 10px; font-weight:600; }
  .mentor-photo-card label{
    display:inline-block; cursor:pointer; background:var(--forest); color:#fff; font-family:Inter,sans-serif;
    font-size:11px; font-weight:600; padding:7px 12px; border-radius:8px;
  }
  .mentor-photo-card .status{ display:block; margin-top:6px; font-family:Inter,sans-serif; font-size:10.5px; color:var(--ink-soft); }
</style>
</head>
<body>

<div class="ambient-layer"><div class="wash"></div><div id="ambientParticles"></div></div>
<header class="topbar">
  <a class="brand" href="index.html">
    <img src="https://i.postimg.cc/k5xbX766/telechargement.jpg" alt="Giveback Groupe 10" class="brand-mark">
    <div class="brand-text">
      <div class="brand-word">Giveback Groupe 10</div>
      <div class="brand-tagline">Éducation, accès aux opportunités</div>
    </div>
  </a>
  <button class="hamburger" aria-label="Menu">☰</button>
  <nav class="sans">
    <a href="index.html">Opportunités</a>
    <a href="tutoriel.html" style="color:var(--gold); font-weight:700;">❓ Comment ça marche</a>
    <a href="espace.html">Mon espace</a>
  </nav>
</header>

<div id="content">
  <div class="admin-wrap">
    <p class="sans" style="color:var(--ink-soft)">Vérification des droits d'accès…</p>
  </div>
</div>

<script src="supabase-js.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
async function init() {
  const content = document.getElementById("content");
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = `
      <div class="locked">
        <h1>Accès administrateur</h1>
        <p>Connecte-toi avec un compte administrateur pour voir le tableau de bord.</p>
        <a class="btn" href="auth.html" style="display:inline-block; margin-top:16px; text-decoration:none;">Se connecter</a>
      </div>`;
    return;
  }

  const { data: adminRow } = await db.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
  if (!adminRow) {
    content.innerHTML = `
      <div class="locked">
        <h1>Accès réservé</h1>
        <p>Ce compte n'a pas les droits administrateur. Si tu penses que c'est une erreur, vérifie la table "admins" dans Supabase.</p>
      </div>`;
    return;
  }

  // Compteurs
  const [profiles, opportunities, applications, applicationsDeposees, mentors, mentorRequests, posts,
         modeleCentrale, modeleEmih, cvGeneres, lettresGenerees] = await Promise.all([
    db.from("profiles").select("*", { count: "exact", head: true }),
    db.from("opportunities").select("*", { count: "exact", head: true }),
    db.from("applications").select("*", { count: "exact", head: true }),
    db.from("applications").select("*", { count: "exact", head: true }).eq("status", "Déposée"),
    db.from("mentors").select("*", { count: "exact", head: true }),
    db.from("mentor_requests").select("*", { count: "exact", head: true }),
    db.from("posts").select("*", { count: "exact", head: true }),
    db.from("outils_usage").select("*", { count: "exact", head: true }).eq("type", "modele_centrale_2ie"),
    db.from("outils_usage").select("*", { count: "exact", head: true }).eq("type", "modele_emih_eree_bgis"),
    db.from("outils_usage").select("*", { count: "exact", head: true }).eq("type", "cv_genere"),
    db.from("outils_usage").select("*", { count: "exact", head: true }).eq("type", "lettre_generee"),
  ]);

  content.innerHTML = `
    <div class="admin-wrap">
      <h1 style="font-size:26px; font-weight:500; margin:0 0 4px;">Tableau de bord</h1>
      <p class="sans" style="color:var(--ink-soft); margin:0 0 10px; font-size:13.5px;">Vue d'ensemble de l'activité sur la plateforme.</p>

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${profiles.count ?? 0}</div><div class="stat-label">Inscrits</div></div>
        <div class="stat-card"><div class="stat-num">${opportunities.count ?? 0}</div><div class="stat-label">Opportunités</div></div>
        <div class="stat-card"><div class="stat-num">${applications.count ?? 0}</div><div class="stat-label">Ajoutées à un suivi</div></div>
        <div class="stat-card" style="background:var(--gold); color:var(--forest-deep);"><div class="stat-num">${applicationsDeposees.count ?? 0}</div><div class="stat-label" style="color:var(--forest-deep);">✓ Réellement déposées</div></div>
        <div class="stat-card"><div class="stat-num">${mentors.count ?? 0}</div><div class="stat-label">Mentors</div></div>
        <div class="stat-card"><div class="stat-num">${mentorRequests.count ?? 0}</div><div class="stat-label">Demandes mentorat</div></div>
        <div class="stat-card"><div class="stat-num">${posts.count ?? 0}</div><div class="stat-label">Publications</div></div>
      </div>
      <p class="sans" style="color:var(--ink-soft); margin:10px 0 20px; font-size:11.5px; font-style:italic;">"Ajoutées à un suivi" = intérêt marqué sur la plateforme. "Réellement déposées" = confirmé par l'utilisateur avoir soumis sa candidature sur le site officiel de l'organisme.</p>

      <div class="section-title">Outils CV & lettre de motivation</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${modeleCentrale.count ?? 0}</div><div class="stat-label">Modèle Centrale-2iE téléchargé</div></div>
        <div class="stat-card"><div class="stat-num">${modeleEmih.count ?? 0}</div><div class="stat-label">Modèle EMIH/EREE/BGIS téléchargé</div></div>
        <div class="stat-card"><div class="stat-num">${cvGeneres.count ?? 0}</div><div class="stat-label">CV générés sur la plateforme</div></div>
        <div class="stat-card"><div class="stat-num">${lettresGenerees.count ?? 0}</div><div class="stat-label">Lettres générées sur la plateforme</div></div>
      </div>

      <div class="section-title">Profils vulnérables (statistiques globales, jamais nominatives)</div>
      <div class="stat-grid" id="vulnStats">
        <div class="stat-card"><div class="stat-num">…</div><div class="stat-label">Situation de handicap</div></div>
        <div class="stat-card"><div class="stat-num">…</div><div class="stat-label">Orphelins</div></div>
        <div class="stat-card"><div class="stat-num">…</div><div class="stat-label">Famille modeste</div></div>
      </div>

      <div class="section-title">Derniers inscrits</div>
      <p class="sans" style="font-size:11px; color:var(--ink-soft); margin:-8px 0 10px;">Par transparence envers les utilisateurs, la situation individuelle (handicap/orphelin/famille modeste) et la date de naissance ne sont pas affichées ici — seulement des statistiques globales ci-dessus.</p>
      <table><thead><tr><th>Prénom</th><th>Statut</th><th>Ville</th><th>Pays</th><th>Inscrit le</th></tr></thead>
        <tbody id="tblProfiles"><tr class="empty-row"><td colspan="5">Chargement…</td></tr></tbody></table>

      <div class="section-title">Dernières candidatures (statut réel : En cours = suivi seulement, Déposée = confirmé par l'utilisateur)</div>
      <table><thead><tr><th>Utilisateur</th><th>Opportunité</th><th>Statut</th><th>Date</th></tr></thead>
        <tbody id="tblApplications"><tr class="empty-row"><td colspan="4">Chargement…</td></tr></tbody></table>

      <div class="section-title">Dernières demandes de mentorat</div>
      <table><thead><tr><th>Utilisateur</th><th>Mentor</th><th>Statut</th><th>Date</th></tr></thead>
        <tbody id="tblMentorRequests"><tr class="empty-row"><td colspan="4">Chargement…</td></tr></tbody></table>

      <div class="section-title">Dernières publications</div>
      <table><thead><tr><th>Auteur</th><th>Message</th><th>Date</th></tr></thead>
        <tbody id="tblPosts"><tr class="empty-row"><td colspan="3">Chargement…</td></tr></tbody></table>

      <div class="section-title">Mini-formations les plus aimées</div>
      <table><thead><tr><th>Titre</th><th>Catégorie</th><th>❤️ Likes</th><th>💬 Commentaires</th></tr></thead>
        <tbody id="tblFormations"><tr class="empty-row"><td colspan="4">Chargement…</td></tr></tbody></table>

      <div class="section-title">Retours des testeurs (preuve terrain)</div>
      <table><thead><tr><th>Nom</th><th>Facilité</th><th>Pertinence</th><th>Fonctionnalité utile</th><th>Recommande</th><th>Date</th></tr></thead>
        <tbody id="tblFeedbacks"><tr class="empty-row"><td colspan="6">Chargement…</td></tr></tbody></table>

      <div class="section-title">Photos des mentors</div>
      <p class="sans" style="color:var(--ink-soft); margin:-6px 0 16px; font-size:12px;">Cliquez sur "Choisir une photo" pour chaque mentor. La photo apparaît immédiatement sur sa fiche publique.</p>
      <div id="mentorPhotosGrid" class="mentor-photos-grid"></div>

      <div class="section-title">Entretiens terrain déclarés (diagnostic, point 2)</div>
      <table><thead><tr><th>Enquêteur</th><th>Code</th><th>Pays</th><th>Réponses</th><th>Preuve</th><th>Date</th></tr></thead>
        <tbody id="tblEntretiens"><tr class="empty-row"><td colspan="6">Chargement…</td></tr></tbody></table>

      <div class="section-title">Accompagnements déclarés</div>
      <table><thead><tr><th>Membre</th><th>Code</th><th>Type</th><th>Notes</th><th>Preuve</th><th>Date</th></tr></thead>
        <tbody id="tblAccompagnements"><tr class="empty-row"><td colspan="6">Chargement…</td></tr></tbody></table>
    </div>
  `;

  loadProfiles();
  loadVulnStats();
  loadApplications();
  loadMentorRequests();
  loadPosts();
  loadFormations();
  loadFeedbacks();
  loadMentorPhotos();
  loadEntretiens();
  loadAccompagnements();
}

async function loadProfiles() {
  const { data } = await db.from("profiles").select("prenom, statut, ville, pays, created_at").order("created_at", { ascending: false }).limit(15);
  const tbl = document.getElementById("tblProfiles");
  if (!data || data.length === 0) { tbl.innerHTML = `<tr class="empty-row"><td colspan="5">Aucun inscrit pour le moment.</td></tr>`; return; }
  tbl.innerHTML = data.map(p => `
    <tr>
      <td>${p.prenom || "—"}</td>
      <td>${p.statut || "—"}</td>
      <td>${p.ville || "—"}</td>
      <td>${p.pays || "—"}</td>
      <td>${p.created_at ? new Date(p.created_at).toLocaleDateString("fr-FR") : "—"}</td>
    </tr>
  `).join("");
}

async function loadVulnStats() {
  const [handicap, orphelin, familleModeste] = await Promise.all([
    db.from("profiles").select("*", { count: "exact", head: true }).contains("tags", ["handicap"]),
    db.from("profiles").select("*", { count: "exact", head: true }).contains("tags", ["orphelin"]),
    db.from("profiles").select("*", { count: "exact", head: true }).contains("tags", ["famille-modeste"]),
  ]);
  const el = document.getElementById("vulnStats");
  el.innerHTML = `
    <div class="stat-card"><div class="stat-num">${handicap.count ?? 0}</div><div class="stat-label">Situation de handicap</div></div>
    <div class="stat-card"><div class="stat-num">${orphelin.count ?? 0}</div><div class="stat-label">Orphelins</div></div>
    <div class="stat-card"><div class="stat-num">${familleModeste.count ?? 0}</div><div class="stat-label">Famille modeste</div></div>
  `;
}

let profilesMap = {};

async function loadProfilesMap() {
  const { data } = await db.from("profiles").select("id, prenom");
  profilesMap = {};
  (data || []).forEach(p => { profilesMap[p.id] = p.prenom; });
}

async function loadApplications() {
  await loadProfilesMap();
  const { data } = await db
    .from("applications")
    .select("user_id, status, created_at, opportunities(title)")
    .order("created_at", { ascending: false }).limit(15);
  const tbl = document.getElementById("tblApplications");
  if (!data || data.length === 0) { tbl.innerHTML = `<tr class="empty-row"><td colspan="4">Aucune candidature pour le moment.</td></tr>`; return; }
  tbl.innerHTML = data.map(a => `
    <tr>
      <td>${profilesMap[a.user_id] || "—"}</td>
      <td>${a.opportunities?.title || "—"}</td>
      <td><span class="status-pill" style="${a.status === 'Déposée' ? 'background:var(--forest); color:var(--paper);' : ''}">${a.status || "—"}</span></td>
      <td>${new Date(a.created_at).toLocaleDateString("fr-FR")}</td>
    </tr>
  `).join("");
}

async function loadMentorRequests() {
  if (Object.keys(profilesMap).length === 0) await loadProfilesMap();
  const { data } = await db
    .from("mentor_requests")
    .select("user_id, status, created_at, mentors(nom)")
    .order("created_at", { ascending: false }).limit(15);
  const tbl = document.getElementById("tblMentorRequests");
  if (!data || data.length === 0) { tbl.innerHTML = `<tr class="empty-row"><td colspan="4">Aucune demande pour le moment.</td></tr>`; return; }
  tbl.innerHTML = data.map(m => `
    <tr>
      <td>${profilesMap[m.user_id] || "—"}</td>
      <td>${m.mentors?.nom || "—"}</td>
      <td><span class="status-pill">${m.status || "—"}</span></td>
      <td>${new Date(m.created_at).toLocaleDateString("fr-FR")}</td>
    </tr>
  `).join("");
}

async function loadPosts() {
  const { data } = await db.from("posts").select("*").order("created_at", { ascending: false }).limit(15);
  const tbl = document.getElementById("tblPosts");
  if (!data || data.length === 0) { tbl.innerHTML = `<tr class="empty-row"><td colspan="3">Aucune publication pour le moment.</td></tr>`; return; }
  tbl.innerHTML = data.map(p => `
    <tr><td>${p.auteur_prenom || "—"}</td><td>${(p.contenu || "").slice(0, 80)}${p.contenu && p.contenu.length > 80 ? "…" : ""}</td><td>${new Date(p.created_at).toLocaleDateString("fr-FR")}</td></tr>
  `).join("");
}

async function loadFormations() {
  const { data: formations } = await db.from("formations").select("id, titre, categorie");
  const tbl = document.getElementById("tblFormations");
  if (!formations || formations.length === 0) {
    tbl.innerHTML = `<tr class="empty-row"><td colspan="4">Aucune formation pour le moment.</td></tr>`;
    return;
  }

  const rows = await Promise.all(formations.map(async f => {
    const { count: likes } = await db.from("formation_likes").select("*", { count: "exact", head: true }).eq("formation_id", f.id);
    const { count: comments } = await db.from("formation_comments").select("*", { count: "exact", head: true }).eq("formation_id", f.id);
    return { ...f, likes: likes || 0, comments: comments || 0 };
  }));

  rows.sort((a, b) => b.likes - a.likes);

  tbl.innerHTML = rows.map(f => `
    <tr><td>${f.titre}</td><td>${f.categorie || "—"}</td><td>${f.likes}</td><td>${f.comments}</td></tr>
  `).join("");
}

async function loadFeedbacks() {
  const { data } = await db.from("feedbacks").select("*").order("created_at", { ascending: false });
  const tbl = document.getElementById("tblFeedbacks");
  if (!data || data.length === 0) {
    tbl.innerHTML = `<tr class="empty-row"><td colspan="6">Aucun retour pour le moment.</td></tr>`;
    return;
  }
  tbl.innerHTML = data.map(f => `
    <tr>
      <td>${f.auteur_prenom || "—"}</td>
      <td>${f.note_facilite ? f.note_facilite + "/5" : "—"}</td>
      <td>${f.opportunites_pertinentes || "—"}</td>
      <td>${f.fonctionnalite_utile || "—"}</td>
      <td>${f.recommande === true ? "✓ Oui" : f.recommande === false ? "✗ Non" : "—"}</td>
      <td>${new Date(f.created_at).toLocaleDateString("fr-FR")}</td>
    </tr>
  `).join("");
}

init();
</script>

  btn.addEventListener("click", () => {
    const nav = btn.closest("header").querySelector("nav.sans");

<script>
async function loadMentorPhotos() {
  const grid = document.getElementById("mentorPhotosGrid");
  if (!grid) return;
  const { data: mentorsList } = await db.from("mentors").select("id, nom, photo_url").order("nom");
  if (!mentorsList || mentorsList.length === 0) {
    grid.innerHTML = `<p class="sans" style="color:var(--ink-soft);">Aucun mentor pour le moment.</p>`;
    return;
  }

  grid.innerHTML = mentorsList.map(m => {
    const initials = (m.nom || "?").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const imgHtml = m.photo_url
      ? `<img src="${m.photo_url}" alt="${m.nom}" id="mentorImg-${m.id}">`
      : `<div class="avatar-placeholder" id="mentorImg-${m.id}">${initials}</div>`;
    return `
      <div class="mentor-photo-card">
        ${imgHtml}
        <h4>${m.nom}</h4>
        <label for="mentorFile-${m.id}">📷 Choisir une photo</label>
        <input type="file" id="mentorFile-${m.id}" accept="image/png, image/jpeg, image/webp" style="display:none;" data-mentor-id="${m.id}">
        <span class="status" id="mentorStatus-${m.id}"></span>
      </div>
    `;
  }).join("");

  grid.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const mentorId = e.target.dataset.mentorId;
      const statusEl = document.getElementById(`mentorStatus-${mentorId}`);

      if (file.size > 5 * 1024 * 1024) {
        statusEl.textContent = "Image trop lourde (max 5 Mo).";
        return;
      }

      statusEl.textContent = "Envoi en cours...";
      const ext = file.name.split(".").pop();
      const filePath = `mentors/${mentorId}-${Date.now()}.${ext}`;

      const { error: uploadError } = await db.storage.from("photos-profil").upload(filePath, file, { upsert: true });
      if (uploadError) {
        statusEl.textContent = "Erreur : " + uploadError.message;
        return;
      }

      const { data: publicUrlData } = db.storage.from("photos-profil").getPublicUrl(filePath);
      const { error: updateError } = await db.from("mentors").update({ photo_url: publicUrlData.publicUrl }).eq("id", mentorId);
      if (updateError) {
        statusEl.textContent = "Erreur sauvegarde : " + updateError.message;
        return;
      }

      const imgEl = document.getElementById(`mentorImg-${mentorId}`);
      imgEl.outerHTML = `<img src="${publicUrlData.publicUrl}" alt="" id="mentorImg-${mentorId}">`;
      statusEl.textContent = "✓ Photo mise à jour";
    });
  });
}
async function loadEntretiens() {
  const tbody = document.getElementById("tblEntretiens");
  if (!tbody) return;
  const { data } = await db.from("entretiens")
    .select("interviewer, interviewee_code, pays, reponses, type_preuve, preuve_fichier, created_at")
    .order("created_at", { ascending: false });

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Aucun entretien déclaré pour le moment.</td></tr>`;
    return;
  }

  const rows = await Promise.all(data.map(async e => {
    let preuveHtml = "—";
    if (e.preuve_fichier) {
      const { data: signed } = await db.storage.from("preuves-entretiens").createSignedUrl(e.preuve_fichier, 3600);
      preuveHtml = signed?.signedUrl
        ? `<a href="${signed.signedUrl}" target="_blank" rel="noopener">📎 Voir</a>`
        : "📎 (lien indisponible)";
    } else if (e.type_preuve) {
      preuveHtml = e.type_preuve.replace("_", " ");
    }
    return `<tr>
      <td>${e.interviewer}</td>
      <td>${e.interviewee_code}</td>
      <td>${e.pays || "—"}</td>
      <td style="max-width:280px;">${e.reponses}</td>
      <td>${preuveHtml}</td>
      <td>${new Date(e.created_at).toLocaleDateString("fr-FR")}</td>
    </tr>`;
  }));

  tbody.innerHTML = rows.join("");
}

async function loadAccompagnements() {
  const tbody = document.getElementById("tblAccompagnements");
  if (!tbody) return;
  const { data } = await db.from("accompagnements")
    .select("mentor_ou_membre, beneficiaire_code, type, notes, preuve_fichier, created_at")
    .order("created_at", { ascending: false });

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Aucun accompagnement déclaré pour le moment.</td></tr>`;
    return;
  }

  const typeLabels = { cv: "CV relu", lettre: "Lettre corrigée", eligibilite: "Éligibilité vérifiée", candidature: "Aide candidature", mentorat: "Mentorat" };

  const rows = await Promise.all(data.map(async a => {
    let preuveHtml = "—";
    if (a.preuve_fichier) {
      const { data: signed } = await db.storage.from("preuves-accompagnement").createSignedUrl(a.preuve_fichier, 3600);
      preuveHtml = signed?.signedUrl
        ? `<a href="${signed.signedUrl}" target="_blank" rel="noopener">📎 Voir</a>`
        : "📎 (lien indisponible)";
    }
    return `<tr>
      <td>${a.mentor_ou_membre}</td>
      <td>${a.beneficiaire_code}</td>
      <td>${typeLabels[a.type] || a.type}</td>
      <td style="max-width:220px;">${a.notes || "—"}</td>
      <td>${preuveHtml}</td>
      <td>${new Date(a.created_at).toLocaleDateString("fr-FR")}</td>
    </tr>`;
  }));

  tbody.innerHTML = rows.join("");
}
</script>
</body>
</html>
