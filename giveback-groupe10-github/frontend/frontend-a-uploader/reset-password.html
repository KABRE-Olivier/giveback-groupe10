<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveback Groupe 10 — Nouveau mot de passe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <img src="https://i.postimg.cc/k5xbX766/telechargement.jpg" alt="Giveback Groupe 10" class="brand-mark">
    <div class="brand-text">
      <div class="brand-word">Giveback Groupe 10</div>
      <div class="brand-tagline">Éducation, accès aux opportunités</div>
    </div>
  </a>
</header>

<section class="page-shell">
  <div class="narrow" style="background:var(--paper-raised); border-radius:16px; padding:36px 32px; box-shadow:0 24px 60px rgba(0,0,0,.25); margin:60px auto; max-width:420px;">
    <h2 style="margin:0 0 6px;">Nouveau mot de passe</h2>
    <p style="font-family:Inter,sans-serif; font-size:13px; color:var(--ink-soft); margin:0 0 20px;">
      Choisissez un nouveau mot de passe pour votre compte.
    </p>

    <form id="resetForm">
      <div class="field">
        <label>Nouveau mot de passe (6 caractères minimum)</label>
        <input type="password" id="newPassword" required minlength="6">
      </div>
      <div class="field">
        <label>Confirmez le mot de passe</label>
        <input type="password" id="confirmPassword" required minlength="6">
      </div>
      <button class="btn" type="submit" style="width:100%;">Valider le nouveau mot de passe</button>
      <div class="msg" id="resetMsg"></div>
    </form>
  </div>
</section>

<script src="supabase-js.min.js"></script>
<script src="supabaseClient.js"></script>
<script>
function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
}

const resetForm = document.getElementById("resetForm");

resetForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("resetMsg");
  const p1 = document.getElementById("newPassword").value;
  const p2 = document.getElementById("confirmPassword").value;

  if (p1 !== p2) {
    showMsg(msg, "Les deux mots de passe ne correspondent pas.", false);
    return;
  }

  const { error } = await db.auth.updateUser({ password: p1 });
  if (error) {
    showMsg(msg, "Le lien a peut-être expiré. Redemandez un lien depuis la page de connexion. (" + error.message + ")", false);
    return;
  }
  showMsg(msg, "Mot de passe mis à jour ! Redirection...", true);
  setTimeout(() => { window.location.href = "espace.html"; }, 1800);
});
</script>
</body>
</html>
