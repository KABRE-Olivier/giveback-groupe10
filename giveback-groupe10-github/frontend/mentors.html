<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveback Groupe 10 — Mentors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .mentor-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .mentor-avatar{ width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg, var(--forest), var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--paper); font-family:Inter,sans-serif; font-weight:700; font-size:15px; letter-spacing:.02em; }
  .contact-link{ font-family:Inter,sans-serif; font-size:12px; font-weight:600; color:var(--forest); text-decoration:none; }
  .contact-link:hover{ text-decoration:underline; }
  .contact-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .whatsapp-link{ font-family:Inter,sans-serif; font-size:12px; font-weight:600; color:#1F8A4C; text-decoration:none; }
  .whatsapp-link:hover{ text-decoration:underline; }
  .mentor-card h3{ font-size:16px; margin:0; font-weight:500; }
  .mentor-card p{ font-family:Inter,sans-serif; font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.5; }
  .expertise-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .expertise-tags span{ font-family:Inter,sans-serif; font-size:10px; text-transform:uppercase; padding:4px 8px; border-radius:5px; background:var(--gold-soft); color:var(--forest-deep); }
  .request-btn{ background:var(--forest); color:var(--paper); border:none; padding:10px 16px; border-radius:8px; font-size:13px; font-family:Inter,sans-serif; font-weight:600; margin-top:auto; }
  .request-btn[disabled]{ background:var(--line); color:var(--ink-soft); }
</style>
</head>
<body>

<div class="ambient-layer" style="display:none"><div class="wash"></div><div id="ambientParticles"></div></div>
<header class="topbar">
  <a class="brand" href="index.html">
    <img src="https://i.postimg.cc/k5xbX766/telechargement.jpg" alt="Giveback Groupe 10" class="brand-mark">
    <div class="brand-text">
      <div class="brand-word">Giveback Groupe 10</div>
      <div class="brand-tagline">Éducation, accès aux opportunités</div>
    </div>
  </a>
  <nav class="sans">
    <a href="index.html">Opportunités</a>
    <a href="formations.html">Mini-formations</a>
    <a href="mentors.html">Mentors</a>
    <a href="communaute.html">Communauté</a>
    <a href="espace.html">Mon espace</a>
  </nav>
</header>

<section class="page-shell">
  <div class="shell-bg"></div>
  <div class="shell-particles" id="heroParticles"></div>

  <div class="hero-content" style="padding-top:56px; padding-bottom:8px;">
    <h1>Nos mentors</h1>
    <p class="lead">Des personnes qui sont passées par là et peuvent vous accompagner dans vos démarches.</p>
  </div>

  <div class="wrap shell-inner">
  <div id="grid" class="grid">
    <p class="sans" style="color:#D9E2DD">Chargement…</p>
  </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
let currentUser = null;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  currentUser = session ? session.user : null;

  const { data, error } = await db.from("mentors").select("*").order("nom");
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (error) {
    grid.innerHTML = `<p class="sans" style="color:var(--danger)">Erreur : ${error.message}</p>`;
    return;
  }
  if (!data || data.length === 0) {
    grid.innerHTML = `<div class="empty">Aucun mentor pour le moment. Ajoutes-en depuis Supabase (table "mentors").</div>`;
    return;
  }

  data.forEach(m => {
    const card = document.createElement("div");
    card.className = "mentor-card";
    const tags = (m.expertise || []).map(t => `<span>${t}</span>`).join("");
    const initials = m.nom.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const avatarHtml = m.photo_url
      ? `<img src="${m.photo_url}" alt="${m.nom}" class="mentor-avatar" style="object-fit:cover;">`
      : `<div class="mentor-avatar">${initials}</div>`;
    const preMessage = "Bonjour, j'ai obtenu votre contact via la plateforme Giveback Groupe 10 et j'aimerais un accompagnement pour ma candidature.";
    const contactBtn = m.contact
      ? `<a class="contact-link" href="mailto:${m.contact}?subject=${encodeURIComponent('Demande d\'accompagnement — Giveback Groupe 10')}&body=${encodeURIComponent(preMessage)}">✉ Email</a>`
      : "";
    const whatsappBtn = m.whatsapp
      ? `<a class="whatsapp-link" href="https://wa.me/${m.whatsapp}?text=${encodeURIComponent(preMessage)}" target="_blank" rel="noopener">💬 WhatsApp</a>`
      : "";
    const contactRow = (contactBtn || whatsappBtn)
      ? `<div class="contact-row">${contactBtn}${whatsappBtn}</div>`
      : "";
    const hasContact = !!(m.contact || m.whatsapp);
    card.innerHTML = `
      ${avatarHtml}
      <h3>${m.nom}</h3>
      <p>${m.bio || ""}</p>
      <div class="expertise-tags">${tags}</div>
      ${contactRow}
      <button class="request-btn" data-id="${m.id}" data-whatsapp="${m.whatsapp || ""}" data-email="${m.contact || ""}" data-has-contact="${hasContact}">Demander ce mentor</button>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll(".request-btn").forEach(btn => {
    let firstClick = true;
    btn.addEventListener("click", async () => {
      if (!currentUser) {
        window.location.href = "auth.html";
        return;
      }
      const mentorId = parseInt(btn.dataset.id, 10);
      const whatsapp = btn.dataset.whatsapp;
      const email = btn.dataset.email;

      if (firstClick) {
        await db.from("mentor_requests").insert({
          user_id: currentUser.id, mentor_id: mentorId, message: "Demande depuis la page Mentors",
        });
        firstClick = false;
      }

      const message = "Bonjour, j'ai obtenu votre contact via la plateforme Giveback Groupe 10 et j'aimerais un accompagnement pour ma candidature.";

      if (whatsapp) {
        btn.textContent = "💬 Recontacter sur WhatsApp";
        window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`, "_blank", "noopener");
      } else if (email) {
        btn.textContent = "✉ Recontacter par email";
        window.location.href = `mailto:${email}?subject=${encodeURIComponent("Demande d'accompagnement — Giveback Groupe 10")}&body=${encodeURIComponent(message)}`;
      } else {
        btn.textContent = "✓ Demande enregistrée";
        btn.disabled = true;
      }
    });
  });
}
init();
</script>
<script>
(function () {
  const zone = document.getElementById("heroParticles");
  if (!zone) return;
  const n = 26;
  for (let i = 0; i < n; i++) {
    const dot = document.createElement("span");
    const size = 3 + Math.random() * 5;
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.left = Math.random() * 100 + "%";
    dot.style.top = Math.random() * 100 + "%";
    dot.style.animationDuration = (5 + Math.random() * 6) + "s";
    dot.style.animationDelay = (Math.random() * 6) + "s";
    zone.appendChild(dot);
  }
})();
</script>
</body>
</html>
