<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveback Groupe 10 — Opportunités éducatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <img src="https://i.postimg.cc/k5xbX766/telechargement.jpg" alt="Giveback Groupe 10" class="brand-mark">
    <div class="brand-text">
      <div class="brand-word">Giveback Groupe 10</div>
      <div class="brand-tagline">Éducation, accès aux opportunités</div>
    </div>
  </a>
  <nav class="sans">
    <a href="index.html">Opportunités</a>
    <a href="espace.html">Mon espace</a>
    <a href="formations.html">Mini-formations</a>
    <a href="mentors.html">Mentors</a>
    <a href="communaute.html">Communauté</a>
    <a id="authLink" href="auth.html">Se connecter</a>
  </nav>
</header>

<section class="page-shell">
  <div class="shell-bg"></div>
  <div class="shell-particles" id="heroParticles"></div>

  <div class="hero-content" style="padding-top:56px; padding-bottom:8px;">
    <h1>Toutes les opportunités éducatives, au même endroit</h1>
    <p class="lead">Bourses, concours, formations et événements — vérifiés par l'équipe Giveback Groupe 10.</p>
  </div>

  <div class="wrap shell-inner">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Rechercher une bourse, un stage, un mot-clé…">
    </div>
    <div id="filters" class="filters"></div>
    <div id="grid" class="grid">
      <p class="sans" style="color:#D9E2DD">Chargement des opportunités…</p>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
// Particules scintillantes réparties sur toute la hauteur du shell
(function () {
  const zone = document.getElementById("heroParticles");
  const n = 26;
  for (let i = 0; i < n; i++) {
    const dot = document.createElement("span");
    const size = 3 + Math.random() * 5;
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.left = Math.random() * 100 + "%";
    dot.style.top = Math.random() * 100 + "%";
    dot.style.animationDuration = (5 + Math.random() * 6) + "s";
    dot.style.animationDelay = (Math.random() * 6) + "s";
    zone.appendChild(dot);
  }
})();
</script>
<script>
async function init() {
  // Adapter le lien "Se connecter" si l'utilisateur est déjà connecté
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    document.getElementById("authLink").textContent = "Mon compte";
    document.getElementById("authLink").href = "espace.html";
  }

  const { data, error } = await db
    .from("opportunities")
    .select("*")
    .order("deadline", { ascending: true });

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (error) {
    grid.innerHTML = `<p class="sans" style="color:var(--danger)">Erreur de chargement : ${error.message}. Vérifie ta configuration Supabase dans supabaseClient.js.</p>`;
    return;
  }

  if (!data || data.length === 0) {
    grid.innerHTML = `<div class="empty">Aucune opportunité pour le moment. Ajoutes-en depuis Supabase (table "opportunities").</div>`;
    return;
  }

  // Construire la liste des types présents, pour les filtres
  const types = Array.from(new Set(data.map(o => o.type).filter(Boolean))).sort();
  const filtersDiv = document.getElementById("filters");
  const searchInput = document.getElementById("searchInput");
  let activeType = "Tous";
  let searchTerm = "";

  searchInput.addEventListener("input", () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderCards();
  });

  function renderFilters() {
    filtersDiv.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "filter-chip" + (activeType === "Tous" ? " active" : "");
    allChip.textContent = `Tous (${data.length})`;
    allChip.addEventListener("click", () => { activeType = "Tous"; renderFilters(); renderCards(); });
    filtersDiv.appendChild(allChip);

    types.forEach(t => {
      const count = data.filter(o => o.type === t).length;
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (activeType === t ? " active" : "");
      chip.textContent = `${t} (${count})`;
      chip.addEventListener("click", () => { activeType = t; renderFilters(); renderCards(); });
      filtersDiv.appendChild(chip);
    });
  }

  function renderCards() {
    let filtered = activeType === "Tous" ? data : data.filter(o => o.type === activeType);
    if (searchTerm) {
      filtered = filtered.filter(o =>
        (o.title || "").toLowerCase().includes(searchTerm) ||
        (o.description || "").toLowerCase().includes(searchTerm) ||
        (o.type || "").toLowerCase().includes(searchTerm) ||
        (o.partenaire || "").toLowerCase().includes(searchTerm)
      );
    }
    grid.innerHTML = "";

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty">Aucune opportunité ne correspond à ta recherche.</div>`;
      return;
    }

    filtered.forEach(opp => {
    const card = document.createElement("div");
    card.className = "card";
    const deadline = opp.deadline ? new Date(opp.deadline).toLocaleDateString("fr-FR") : "Voir le site";
    const lienHtml = opp.lien
      ? `<a href="${opp.lien}" target="_blank" rel="noopener" class="btn-pill">Voir l'offre →</a>`
      : `<a href="espace.html" class="btn-pill">Voir →</a>`;
    card.innerHTML = `
      <div class="card-top">
        <span class="tag">${opp.type || ""}</span>
        ${opp.verified ? '<span class="sans" style="font-size:10.5px;color:var(--forest);font-weight:600;">✓ Vérifiée</span>' : ""}
      </div>
      ${opp.logo_url
        ? `<span style="display:flex; align-items:center; gap:12px; margin-bottom:2px;">
             <img src="${opp.logo_url}" alt="${opp.partenaire || ''}" style="height:38px; max-width:150px; object-fit:contain;">
             ${opp.logo_url_2 ? `<img src="${opp.logo_url_2}" alt="" style="height:34px; max-width:100px; object-fit:contain;">` : ""}
           </span>`
        : (opp.partenaire ? `<span class="sans" style="display:inline-block; font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:5px; padding:2px 7px; margin-bottom:2px;">${opp.partenaire}</span>` : "")}
      <h3>${opp.title}</h3>
      <p>${opp.description || ""}</p>
      <div class="card-foot" style="align-items:center;">
        <span>Clôture : ${deadline}</span>
        ${lienHtml}
      </div>
    `;
      grid.appendChild(card);
    });
  }

  renderFilters();
  renderCards();
}
init();
</script>
</body>
</html>
